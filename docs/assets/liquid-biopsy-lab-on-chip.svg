<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="900" fill="#ffffff"/>
  <text x="450" y="440" font-size="19" font-weight="600" text-anchor="middle" fill="#111827">Lab-on-a-Chip Nanoarchitecture</text>
  <text x="450" y="465" font-size="19" font-weight="600" text-anchor="middle" fill="#111827">for Liquid Biopsy-Based</text>
  <text x="450" y="490" font-size="19" font-weight="600" text-anchor="middle" fill="#111827">Cancer Diagnosis</text>

  <!-- Patient -->
  <g>
    <circle cx="130" cy="640" r="18" fill="#e8b89a"/>
    <path d="M100 700 q30 -35 60 0 l-8 60 h-44 Z" fill="#e8b89a"/>
    <line x1="70" y1="655" x2="55" y2="695" stroke="#c0392b" stroke-width="4"/>
    <polygon points="45,690 65,700 55,715" fill="#c0392b"/>
    <text x="130" y="745" font-size="15" text-anchor="middle" fill="#111827">Patient</text>
  </g>
  <text x="230" y="560" font-size="13" fill="#111827" width="150">Liquid biopsy sample</text>
  <text x="230" y="578" font-size="13" fill="#111827">(blood/plasma containing</text>
  <text x="230" y="596" font-size="13" fill="#111827">ctDNA, CTCs, exosomes)</text>
  <path d="M150 640 q40 -80 100 -140" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#b1)"/>

  <!-- Blood tube -->
  <g transform="translate(300,420)">
    <rect x="0" y="30" width="60" height="110" rx="10" fill="#fdf1e0" stroke="#333" stroke-width="2"/>
    <rect x="0" y="80" width="60" height="60" rx="10" fill="#8b1a1a"/>
    <rect x="-6" y="10" width="72" height="24" rx="6" fill="#e07a3f" stroke="#333" stroke-width="2"/>
    <path d="M30 90 q10 10 0 20 q-10 10 0 20" stroke="#111827" fill="none" stroke-width="2"/>
    <circle cx="20" cy="100" r="8" fill="#c0392b"/>
  </g>

  <!-- circulating cells -->
  <circle cx="440" cy="470" r="24" fill="#f2b6b6"/>
  <circle cx="440" cy="470" r="12" fill="#c0392b"/>
  <circle cx="480" cy="520" r="14" fill="#f6d3ac"/>
  <circle cx="500" cy="460" r="10" fill="#f6d3ac"/>
  <circle cx="470" cy="440" r="8" fill="#f6d3ac"/>

  <!-- cancer stem cell tree -->
  <g transform="translate(560,40)">
    <text x="60" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">Cancer Stem Cell</text>
    <circle cx="60" cy="40" r="26" fill="#7a3b3b"/>
    <circle cx="72" cy="30" r="8" fill="#e07a3f"/>
    <text x="130" y="45" font-size="11" fill="#111827">Malignant cancer cells</text>
    <path d="M60 68 v20" stroke="#111827" stroke-width="1.5"/>
    <path d="M60 88 h-40 M60 88 h40" stroke="#111827" stroke-width="1.5"/>
    <path d="M20 88 v14 M60 88 v14 M100 88 v14" stroke="#111827" stroke-width="1.5"/>
    <circle cx="20" cy="112" r="10" fill="#e07a3f"/>
    <circle cx="60" cy="112" r="10" fill="#7a3b3b"/>
    <circle cx="100" cy="112" r="10" fill="#c98b8b"/>
    <text x="10" y="140" font-size="10" fill="#b08900" font-weight="600">Self-renewal</text>
    <text x="15" y="155" font-size="10" fill="#111827">Unlimited</text>
    <rect x="70" y="128" width="90" height="34" fill="none" stroke="#999" stroke-dasharray="3 3"/>
    <text x="75" y="140" font-size="9" fill="#111827">No tumor formation</text>
    <text x="60" y="178" font-size="9" text-anchor="middle" fill="#111827">Limited cell division &amp; differentiation</text>
    <path d="M60 165 q30 30 60 55" stroke="#111827" stroke-width="1.5" fill="none" marker-end="url(#b1)"/>
  </g>

  <!-- Chip -->
  <g transform="translate(660,300)">
    <polygon points="0,20 90,0 110,20 110,180 20,200 0,180" fill="#dfe7ef" stroke="#333" stroke-width="2"/>
    <polygon points="90,0 110,20 110,40 90,20" fill="#c3ceda"/>
    <path d="M20 60 h50 M20 90 h50 M20 120 h50" stroke="#333" stroke-width="3"/>
    <path d="M20 60 v90" stroke="#333" stroke-width="3"/>
    <circle cx="20" cy="60" r="6" fill="#8b8b8b"/>
    <circle cx="70" cy="60" r="6" fill="#8b8b8b"/>
    <path d="M20 150 h55" stroke="#3aafa9" stroke-width="4"/>
  </g>
  <text x="800" y="500" font-size="13" fill="#111827" width="120">On-chip microfluidic</text>
  <text x="800" y="516" font-size="13" fill="#111827">processing and nano-</text>
  <text x="800" y="532" font-size="13" fill="#111827">enabled biomarker capture</text>

  <!-- oncogene detection cells -->
  <circle cx="620" cy="640" r="22" fill="#f2b6b6"/>
  <circle cx="620" cy="640" r="10" fill="#c0392b"/>
  <circle cx="670" cy="660" r="12" fill="#f6d3ac"/>
  <circle cx="700" cy="620" r="10" fill="#f6d3ac"/>
  <circle cx="730" cy="655" r="8" fill="#f6d3ac"/>
  <circle cx="580" cy="670" r="8" fill="#f6d3ac"/>
  <text x="700" y="710" font-size="13" text-anchor="middle" fill="#111827">Oncogene detection</text>
  <path d="M700 610 q40 -90 20 -170" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#b1)"/>

  <!-- readout chip + monitor -->
  <g transform="translate(430,660)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="#eef2f7" stroke="#333" stroke-width="2"/>
    <rect x="15" y="15" width="40" height="45" fill="none" stroke="#3b4a9c" stroke-width="2"/>
    <rect x="24" y="24" width="22" height="12" fill="#f2c14e"/>
    <circle cx="35" cy="48" r="7" fill="#c0392b"/>
    <circle cx="35" cy="-6" r="6" fill="#3aafa9"/>
    <circle cx="35" cy="96" r="6" fill="#3aafa9"/>
  </g>
  <text x="465" y="770" font-size="13" text-anchor="middle" fill="#111827">On-chip signal readout</text>
  <text x="465" y="786" font-size="13" text-anchor="middle" fill="#111827">and data analysis</text>

  <g transform="translate(230,700)">
    <rect x="0" y="0" width="90" height="65" rx="4" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <path d="M10 50 l15 -15 l15 10 l15 -20 l15 15" stroke="#e07a3f" fill="none" stroke-width="2"/>
    <circle cx="10" cy="10" r="4" fill="#333"/>
    <rect x="30" y="65" width="30" height="8" fill="#333"/>
    <rect x="10" y="73" width="70" height="6" rx="2" fill="#333"/>
  </g>

  <path d="M370 730 q-90 20 -170 -60" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#b1)"/>

  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111827"/></marker>
  </defs>
</svg>
