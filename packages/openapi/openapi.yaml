info:
  description: AI-powered biomarker–biosensor co-design platform
  title: BioSense-GovAI API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/biomarkers:
    get:
      description: 'List biomarkers, optionally filtered by cancer type.


        `include_priority_score=true` additionally computes each biomarker''s Biomarker

        Priority Score (requires `cancer_type`) — this calls out to NCI GDC per biomarker,

        so it is opt-in rather than the default for a plain catalog listing.'
      operationId: list_biomarkers_v1_biomarkers_get
      parameters:
      - in: query
        name: cancer_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancer Type
      - in: query
        name: include_priority_score
        required: false
        schema:
          default: false
          title: Include Priority Score
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BiomarkerSummaryResponse'
                title: Response List Biomarkers V1 Biomarkers Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Biomarkers
      tags:
      - Catalog
  /v1/biomarkers/methylation-evidence:
    get:
      description: 'GDC methylation file/project-level discovery for a cancer type
        (Phase 2, Step 1/8).


        Metadata-only — never returns a beta value or CpG-site identifier.'
      operationId: methylation_evidence_v1_biomarkers_methylation_evidence_get
      parameters:
      - description: Cancer type, e.g. 'lung', 'colorectal', 'breast'
        in: query
        name: cancer
        required: true
        schema:
          description: Cancer type, e.g. 'lung', 'colorectal', 'breast'
          title: Cancer
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethylationEvidenceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Methylation Evidence
      tags:
      - Biomarkers
  /v1/biomarkers/{biomarker_id}:
    get:
      operationId: get_biomarker_v1_biomarkers__biomarker_id__get
      parameters:
      - in: path
        name: biomarker_id
        required: true
        schema:
          title: Biomarker Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiomarkerDetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Biomarker
      tags:
      - Catalog
  /v1/biomarkers/{biomarker_name}/priority-score:
    get:
      operationId: get_biomarker_priority_score_v1_biomarkers__biomarker_name__priority_score_get
      parameters:
      - in: path
        name: biomarker_name
        required: true
        schema:
          title: Biomarker Name
          type: string
      - in: query
        name: cancer_type
        required: true
        schema:
          title: Cancer Type
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiomarkerPriorityScoreResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Biomarker Priority Score
      tags:
      - Catalog
  /v1/cancers:
    get:
      operationId: list_cancers_v1_cancers_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CancerResponse'
                title: Response List Cancers V1 Cancers Get
                type: array
          description: Successful Response
      summary: List Cancers
      tags:
      - Catalog
  /v1/evidence:
    get:
      description: 'All literature and sensor-performance evidence backing one biomarker.


        Distinguishes `is_estimated` (literature-derived estimate) from a real

        experimental measurement — never presents one as the other.'
      operationId: get_evidence_v1_evidence_get
      parameters:
      - in: query
        name: biomarker_name
        required: true
        schema:
          title: Biomarker Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Evidence
      tags:
      - Catalog
  /v1/global-cancer-statistics:
    get:
      description: 'National-average incidence/mortality per cancer type from live-integrated
        sources.


        Currently Korea only (KOSIS/KDCA) — see docs/data-access.md for why CDC USCS

        (US aggregate stats) is not automatable and is instead surfaced as an external

        reference link in /v1/sources rather than merged into this endpoint''s data.'
      operationId: get_global_cancer_statistics_v1_global_cancer_statistics_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCancerStatisticsResponse'
          description: Successful Response
      summary: Get Global Cancer Statistics
      tags:
      - Catalog
  /v1/graph/sync/domain:
    post:
      description: Push the existing Postgres Cancer→Biomarker→Recognition→Sensor
        graph into Neo4j.
      operationId: sync_domain_graph_v1_graph_sync_domain_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSyncDomainResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Sync Domain Graph
      tags:
      - Knowledge Graph
  /v1/graph/sync/gene:
    post:
      description: Fetch a gene + its mutations from NCI GDC (open-access) and sync
        into Neo4j.
      operationId: sync_gene_from_gdc_v1_graph_sync_gene_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphSyncGeneRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSyncGeneResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
